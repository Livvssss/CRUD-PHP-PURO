services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile

    ports:
      - "8090:80"

    volumes:
      - .:/var/www/html

    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_NAME: ${MYSQL_DATABASE:-biblioteca_pw}
      DB_USER: ${MYSQL_USER:-usuario_app}
      DB_PASS: ${MYSQL_PASSWORD:-senha_app_123}

    depends_on:
      mysql:
        condition: service_healthy
        required: true

  mysql:
    image: mysql:8.0

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-senha_root_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biblioteca_pw}
      MYSQL_USER: ${MYSQL_USER:-usuario_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-senha_app_123}

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - dados_mysql:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      - "3308:3306"

volumes:
  dados_mysql: